# nginx.conf — reverse proxy + static file serving (kitegen demo)
#
# The frontend build output is mounted by docker-compose to
# /usr/share/nginx/html. Nginx serves the static files directly and proxies
# all API requests to the backend at :8000.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Backend service address (service name in docker-compose is kitegen)
    upstream kitegen_backend {
        server kitegen:8000;
    }

    server {
        listen 80;
        server_name _;  # change to your domain, e.g. example.com

        # API / backend SSE streaming endpoint
        location /chat {
            proxy_pass http://kitegen_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # SSE: disable buffering and caching
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        # Other backend endpoints
        location ~ ^/(reset|portfolio|alerts|usage|briefing|paper|health) {
            proxy_pass http://kitegen_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SPA fallback: static files first, then index.html
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }

    # Uncomment below and configure certificate paths to enable HTTPS
    # server {
    #     listen 443 ssl;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/nginx/cert/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/cert/privkey.pem;
    #
    #     location /chat { ... }
    #     ...
    # }
}
