[project]
name = "kitegen"
version = "0.1.0"
description = "Lightweight agent framework — State + Node + Edge + Checkpoint"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Qisheng Li" }]
keywords = ["agent", "llm", "ai", "langgraph", "lightweight"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "openai>=1.0",
]

[project.optional-dependencies]
pydantic = ["pydantic>=2.0"]
psycopg = ["psycopg>=3.0"]

[project.urls]
Homepage = "https://github.com/QishengLi27/kitegen"
Repository = "https://github.com/QishengLi27/kitegen"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
